name: Skill quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-test.txt
      - run: python -m compileall -q skills/beyin-bedava/scripts benchmarks
      - run: python -m unittest discover -s tests -v
  threejs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/beyin-bedava/adapters/threejs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
  apple:
    runs-on: macos-15
    defaults:
      run:
        working-directory: skills/beyin-bedava/adapters/swift/demo
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/beyin-bedava/adapters/flutter-flame/demo
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter 3.29.3
        run: |
          git clone --depth 1 --branch 3.29.3 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
      - run: flutter test
      - run: flutter build web
