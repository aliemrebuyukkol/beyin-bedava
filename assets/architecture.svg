<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="100%" height="auto" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60A5FA"/>
    </marker>
    <marker id="arrowWarn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <rect width="1120" height="640" rx="16" fill="url(#bg)" stroke="#1F2937" stroke-width="2"/>

  <!-- Title Header -->
  <text x="40" y="46" fill="#F9FAFB" font-size="22" font-weight="700">Beyin-Bedava 3.1.0 — Multi-Agent Branching DAG &amp; 100% Self-Healing Loop</text>
  <text x="40" y="72" fill="#9CA3AF" font-size="13">Single-writer file ownership (SQLite Task Ledger) · Parallel Specialist Branches · Post-Approval Ad/Paywall Gate · Zero Half-Done Items</text>

  <!-- Wave 0: Discovery -->
  <rect x="40" y="235" width="165" height="140" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <text x="56" y="263" fill="#38BDF8" font-size="11" font-weight="700">WAVE 0 · ROOT</text>
  <text x="56" y="286" fill="#F9FAFB" font-size="15" font-weight="700">discovery-agent</text>
  <text x="56" y="308" fill="#CBD5E1" font-size="12">Task: inspect</text>
  <text x="56" y="328" fill="#94A3B8" font-size="11">• Engine &amp; file scan</text>
  <text x="56" y="345" fill="#94A3B8" font-size="11">• New project scaffold</text>
  <text x="56" y="362" fill="#94A3B8" font-size="11">• 100% Checklist init</text>

  <!-- Wave 1: 5 Parallel Branches -->
  <!-- Branch 1: research-agent -->
  <rect x="255" y="100" width="215" height="82" rx="10" fill="#1E293B" stroke="#818CF8" stroke-width="1.8"/>
  <text x="270" y="122" fill="#A5B4FC" font-size="11" font-weight="700">WAVE 1 · PARALLEL BRANCH 1</text>
  <text x="270" y="142" fill="#F9FAFB" font-size="14" font-weight="700">research-agent (research)</text>
  <text x="270" y="162" fill="#94A3B8" font-size="11">Official engine docs &amp; platform policy</text>

  <!-- Branch 2: dna-design-agent -->
  <rect x="255" y="196" width="215" height="82" rx="10" fill="#1E293B" stroke="#34D399" stroke-width="1.8"/>
  <text x="270" y="218" fill="#6EE7B7" font-size="11" font-weight="700">WAVE 1 · PARALLEL BRANCH 2</text>
  <text x="270" y="238" fill="#F9FAFB" font-size="14" font-weight="700">dna-design-agent</text>
  <text x="270" y="258" fill="#94A3B8" font-size="11">Game DNA, 3 mechanics &amp; motivation</text>

  <!-- Branch 3: progression-economy-agent -->
  <rect x="255" y="292" width="215" height="82" rx="10" fill="#1E293B" stroke="#FBBF24" stroke-width="1.8"/>
  <text x="270" y="314" fill="#FDE68A" font-size="11" font-weight="700">WAVE 1 · PARALLEL BRANCH 3</text>
  <text x="270" y="334" fill="#F9FAFB" font-size="14" font-weight="700">progression-economy-agent</text>
  <text x="270" y="354" fill="#94A3B8" font-size="11">Pacing, recovery &amp; fair economy</text>

  <!-- Branch 4: feel-ui-agent -->
  <rect x="255" y="388" width="215" height="82" rx="10" fill="#1E293B" stroke="#F472B6" stroke-width="1.8"/>
  <text x="270" y="410" fill="#FBCFE8" font-size="11" font-weight="700">WAVE 1 · PARALLEL BRANCH 4</text>
  <text x="270" y="430" fill="#F9FAFB" font-size="14" font-weight="700">feel-ui-agent (+tasarim-vergisi)</text>
  <text x="270" y="450" fill="#94A3B8" font-size="11">Game feel, input timing &amp; accessibility</text>

  <!-- Branch 5: monetization-gate-agent -->
  <rect x="255" y="484" width="215" height="92" rx="10" fill="#27173A" stroke="#C084FC" stroke-width="2.2"/>
  <text x="270" y="506" fill="#E9D5FF" font-size="11" font-weight="700">WAVE 1 · APPROVAL GATE</text>
  <text x="270" y="526" fill="#F9FAFB" font-size="14" font-weight="700">monetization-gate-agent</text>
  <text x="270" y="545" fill="#D8B4FE" font-size="11">Asks: Ads &amp; Paywall desired?</text>
  <text x="270" y="562" fill="#94A3B8" font-size="11">Modes: none | ads | paywall | both</text>

  <!-- Wave 2: Engine Build -->
  <rect x="520" y="220" width="175" height="170" rx="12" fill="#1E293B" stroke="#60A5FA" stroke-width="2"/>
  <text x="536" y="246" fill="#93C5FD" font-size="11" font-weight="700">WAVE 2 · BUILD</text>
  <text x="536" y="268" fill="#F9FAFB" font-size="15" font-weight="700">engine-build-agent</text>
  <text x="536" y="288" fill="#CBD5E1" font-size="12">Task: wire</text>
  <text x="536" y="310" fill="#94A3B8" font-size="11">• Vertical gameplay slice</text>
  <text x="536" y="328" fill="#94A3B8" font-size="11">• Engine adapter wiring</text>
  <text x="536" y="346" fill="#94A3B8" font-size="11">• Opt-in Ads / Paywall UI</text>
  <text x="536" y="364" fill="#94A3B8" font-size="11">• Runtime evidence hooks</text>

  <!-- Wave 3: Capability Audits -->
  <rect x="735" y="135" width="180" height="155" rx="12" fill="#1E293B" stroke="#34D399" stroke-width="2"/>
  <text x="750" y="160" fill="#6EE7B7" font-size="11" font-weight="700">WAVE 3 · AUDITS</text>
  <text x="750" y="182" fill="#F9FAFB" font-size="14" font-weight="700">audit-safeguards-agent</text>
  <text x="750" y="204" fill="#94A3B8" font-size="11">• audit_gameplay.py</text>
  <text x="750" y="222" fill="#94A3B8" font-size="11">• audit_telemetry.py</text>
  <text x="750" y="240" fill="#94A3B8" font-size="11">• evaluate_experience.py</text>
  <text x="750" y="258" fill="#94A3B8" font-size="11">• simulate_eomm_dda.py</text>

  <!-- Wave 4: Runtime QA Verification -->
  <rect x="735" y="325" width="180" height="135" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <text x="750" y="350" fill="#7DD3FC" font-size="11" font-weight="700">WAVE 4 · RUNTIME QA</text>
  <text x="750" y="372" fill="#F9FAFB" font-size="14" font-weight="700">qa-verification-agent</text>
  <text x="750" y="394" fill="#94A3B8" font-size="11">• Real game execution</text>
  <text x="750" y="412" fill="#94A3B8" font-size="11">• SHA-256 plan_id check</text>
  <text x="750" y="430" fill="#94A3B8" font-size="11">• Threshold comparators</text>

  <!-- Wave 5: 100% Completion Gate -->
  <rect x="945" y="220" width="145" height="170" rx="12" fill="#064E3B" stroke="#10B981" stroke-width="2.5"/>
  <text x="960" y="246" fill="#6EE7B7" font-size="11" font-weight="700">FINAL GATE</text>
  <text x="960" y="268" fill="#F9FAFB" font-size="15" font-weight="700">beyin-bedava</text>
  <text x="960" y="288" fill="#A7F3D0" font-size="12">completion_gate</text>
  <text x="960" y="312" fill="#D1FAE5" font-size="11">• 100% verified?</text>
  <text x="960" y="330" fill="#D1FAE5" font-size="11">• Zero missing files?</text>
  <text x="960" y="348" fill="#FCD34D" font-size="11">If &lt;100%: Auto-Reopen</text>
  <text x="960" y="366" fill="#FCD34D" font-size="11">&amp; Restart Branch</text>

  <!-- Edges from Wave 0 to Wave 1 -->
  <path d="M 205 280 L 250 141" stroke="#60A5FA" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M 205 292 L 250 237" stroke="#60A5FA" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M 205 305 L 250 333" stroke="#60A5FA" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M 205 318 L 250 429" stroke="#60A5FA" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M 205 335 L 250 530" stroke="#C084FC" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Edges from Wave 1 to Wave 2 -->
  <path d="M 470 141 L 516 260" stroke="#60A5FA" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M 470 237 L 516 280" stroke="#60A5FA" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M 470 333 L 516 305" stroke="#60A5FA" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M 470 429 L 516 325" stroke="#60A5FA" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M 470 530 L 516 350" stroke="#C084FC" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Edges Wave 2 -> Wave 3 & Wave 4 -->
  <path d="M 695 275 L 730 220" stroke="#60A5FA" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M 695 335 L 730 385" stroke="#60A5FA" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M 825 290 L 825 320" stroke="#60A5FA" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <!-- Edge Wave 4 -> Final Gate -->
  <path d="M 915 390 L 941 325" stroke="#10B981" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>

  <!-- Self-Healing Feedback Loop -->
  <path d="M 1017 390 L 1017 602 L 605 602 L 605 396" stroke="#F59E0B" stroke-width="2.2" stroke-dasharray="6,5" fill="none" marker-end="url(#arrowWarn)"/>
  <text x="640" y="592" fill="#FBBF24" font-size="12" font-weight="700">audit-completion --restart-incomplete (Auto-reopens any incomplete/failed branch until 100%)</text>
</svg>
