<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 420" width="100%" height="auto" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#C084FC"/>
    </marker>
  </defs>

  <rect width="1060" height="420" rx="16" fill="url(#bg2)" stroke="#312E81" stroke-width="2"/>

  <text x="36" y="42" fill="#F9FAFB" font-size="20" font-weight="700">monetization-gate-agent — Post-Approval Ad &amp; Paywall Decision Flow</text>
  <text x="36" y="66" fill="#A5B4FC" font-size="13">Never injects unsolicited ads or paywalls · Prompts upon project approval · Enforces ethical &amp; transparent boundaries</text>

  <!-- Step 1: Project Approved -->
  <rect x="36" y="155" width="190" height="110" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <text x="52" y="182" fill="#38BDF8" font-size="11" font-weight="700">1. PROJECT APPROVED</text>
  <text x="52" y="204" fill="#F9FAFB" font-size="14" font-weight="700">Core Loop &amp; Plan Ready</text>
  <text x="52" y="226" fill="#94A3B8" font-size="11">Game DNA, mechanics &amp;</text>
  <text x="52" y="244" fill="#94A3B8" font-size="11">progression approved</text>

  <!-- Step 2: Monetization Gate Agent -->
  <rect x="270" y="135" width="245" height="150" rx="12" fill="#2E1065" stroke="#C084FC" stroke-width="2.2"/>
  <text x="288" y="162" fill="#E9D5FF" font-size="11" font-weight="700">2. DECISION GATE AGENT</text>
  <text x="288" y="184" fill="#F9FAFB" font-size="15" font-weight="700">monetization-gate-agent</text>
  <text x="288" y="208" fill="#DDD6FE" font-size="12">"Proje onaylandı: Reklam ve/veya</text>
  <text x="288" y="226" fill="#DDD6FE" font-size="12">Paywall (IAP) entegrasyonu</text>
  <text x="288" y="244" fill="#DDD6FE" font-size="12">istiyor musunuz?"</text>
  <text x="288" y="268" fill="#A78BFA" font-size="11">--monetization-choice ask</text>

  <!-- 4 Outcome Branches -->
  <!-- Choice A: none -->
  <rect x="575" y="88" width="445" height="68" rx="10" fill="#1E293B" stroke="#64748B" stroke-width="1.8"/>
  <text x="595" y="113" fill="#94A3B8" font-size="13" font-weight="700">Choice: none (Pure Gameplay — Default Safe State)</text>
  <text x="595" y="136" fill="#CBD5E1" font-size="11">adPlacements.enabled = false · purchaseScreens.enabled = false · Zero SDK bloat</text>

  <!-- Choice B: ads -->
  <rect x="575" y="170" width="445" height="68" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="1.8"/>
  <text x="595" y="195" fill="#7DD3FC" font-size="13" font-weight="700">Choice: ads (Ethical AdPlacementManager)</text>
  <text x="595" y="218" fill="#CBD5E1" font-size="11">Opt-in Rewarded preview · Natural-boundary Interstitials (2-loss suppressed) · Safe Banner margin</text>

  <!-- Choice C: paywall -->
  <rect x="575" y="252" width="445" height="68" rx="10" fill="#1E293B" stroke="#34D399" stroke-width="1.8"/>
  <text x="595" y="277" fill="#6EE7B7" font-size="13" font-weight="700">Choice: paywall (Transparent StoreManager &amp; Paywall UI)</text>
  <text x="595" y="300" fill="#CBD5E1" font-size="11">Real-money price display · Aligned packs · 2-step confirm · Disclosed odds/pity · Restore Purchases</text>

  <!-- Choice D: both -->
  <rect x="575" y="334" width="445" height="68" rx="10" fill="#1E293B" stroke="#FBBF24" stroke-width="1.8"/>
  <text x="595" y="359" fill="#FDE68A" font-size="13" font-weight="700">Choice: both (Unified Ads + Paywall + Remove-Ads Entitlement)</text>
  <text x="595" y="382" fill="#CBD5E1" font-size="11">Full AdPlacementManager + StoreManager with Remove-Ads instant banner/interstitial disable</text>

  <!-- Connectors -->
  <path d="M 226 210 L 265 210" stroke="#C084FC" stroke-width="2" fill="none" marker-end="url(#arr2)"/>
  <path d="M 515 180 L 570 122" stroke="#C084FC" stroke-width="1.8" fill="none" marker-end="url(#arr2)"/>
  <path d="M 515 200 L 570 204" stroke="#C084FC" stroke-width="1.8" fill="none" marker-end="url(#arr2)"/>
  <path d="M 515 220 L 570 286" stroke="#C084FC" stroke-width="1.8" fill="none" marker-end="url(#arr2)"/>
  <path d="M 515 240 L 570 368" stroke="#C084FC" stroke-width="1.8" fill="none" marker-end="url(#arr2)"/>
</svg>
